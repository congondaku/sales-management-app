version: 1
frontend:
  phases:
    preBuild:
      commands:
        - chmod +x pre-build.sh
        - ./pre-build.sh
        - npm ci --legacy-peer-deps
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*